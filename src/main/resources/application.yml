server:
  port: 8081

spring:
  application:
    name: auth-service
  
  # Temporarily use H2 in-memory database
  datasource:
    url: jdbc:h2:mem:skycommerce_auth
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # Creates schema on startup, drops on shutdown
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Eureka temporarily disabled
eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics